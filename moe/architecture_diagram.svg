<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1130" width="980" height="1130" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/></marker>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:1.3}
      .exp{fill:#eef4fb;stroke:#2e5c8a;stroke-width:1.3}
      .chk{fill:#fdf6e3;stroke:#9a7b1c;stroke-width:1.3}
      .hum{fill:#eaf6ec;stroke:#2e7d32;stroke-width:1.6}
      .log{fill:#f3f3f3;stroke:#777;stroke-width:1.1;stroke-dasharray:5 3}
      .t{font-weight:bold}
      .s{font-size:11px;fill:#333}
      .w{font-size:12px;fill:#2e5c8a;font-weight:bold}
      .ln{stroke:#444;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .fb{stroke:#b03a2e;stroke-width:1.3;fill:none;stroke-dasharray:6 3;marker-end:url(#r)}
      .fbt{font-size:11px;fill:#b03a2e}
    </style>
  </defs>
  <text x="490" y="26" text-anchor="middle" font-size="17" class="t">Silver-Milk application-level MoE: routing and authority (Lab 10, 1.0-design, ratified 2026-11-24)</text>
  <text x="490" y="44" text-anchor="middle" class="s">Local script orchestrates · seven ChatGPT experts · one narrow ChatGPT prose step · human decision owner. No LLM routes.</text>

  <!-- Intake -->
  <rect class="box" x="150" y="62" width="520" height="70" rx="6"/>
  <text x="410" y="82" text-anchor="middle" class="t">INTAKE (human + script)</text>
  <text x="410" y="99" text-anchor="middle" class="s">11 frozen fields · 10 org-readiness facts (I-23) · DECISION OWNER · assessment date</text>
  <text x="410" y="115" text-anchor="middle" class="s">Run ID · intake SHA-256</text>
  <rect class="chk" x="700" y="62" width="250" height="70" rx="6"/>
  <text x="825" y="82" text-anchor="middle" class="t">SOURCE PACK</text>
  <text x="825" y="99" text-anchor="middle" class="s">dated cards · SOURCE CLASS · checked by</text>
  <text x="825" y="113" text-anchor="middle" class="s">evidence keeper · frozen Pack ID</text>
  <text x="825" y="126" text-anchor="middle" class="s">→ additional_context, same bytes for all 7</text>
  <path class="ln" d="M700,97 L672,97"/>

  <!-- Wave 1 -->
  <text x="20" y="168" class="w">WAVE 1</text><text x="20" y="182" class="s">parallel</text>
  <path class="ln" d="M410,132 L410,150"/>
  <line x1="150" y1="150" x2="840" y2="150" stroke="#444" stroke-width="1.4"/>
  <g>
    <rect class="exp" x="95" y="160" width="140" height="56" rx="6"/><text x="165" y="182" text-anchor="middle" class="t">Creation</text><text x="165" y="200" text-anchor="middle" class="s">ARC STAGE</text>
    <rect class="exp" x="250" y="160" width="140" height="56" rx="6"/><text x="320" y="182" text-anchor="middle" class="t">Innovation</text><text x="320" y="200" text-anchor="middle" class="s">LIFECYCLE · DEGREE</text>
    <rect class="exp" x="405" y="160" width="140" height="56" rx="6"/><text x="475" y="182" text-anchor="middle" class="t">Promethean</text><text x="475" y="200" text-anchor="middle" class="s">CLASS · WEIGHT</text>
    <rect class="exp" x="560" y="160" width="140" height="56" rx="6"/><text x="630" y="182" text-anchor="middle" class="t">Diffusion</text><text x="630" y="200" text-anchor="middle" class="s">STAGES · TIMING</text>
    <rect class="exp" x="715" y="160" width="140" height="56" rx="6"/><text x="785" y="182" text-anchor="middle" class="t">Landscape</text><text x="785" y="200" text-anchor="middle" class="s">STANCE · GATES</text>
  </g>
  <g stroke="#444" stroke-width="1.4">
    <line x1="165" y1="150" x2="165" y2="160"/><line x1="320" y1="150" x2="320" y2="160"/><line x1="475" y1="150" x2="475" y2="160"/><line x1="630" y1="150" x2="630" y2="160"/><line x1="785" y1="150" x2="785" y2="160"/>
  </g>
  <line x1="475" y1="216" x2="475" y2="240" stroke="#444" stroke-width="1.4"/>
  <line x1="630" y1="216" x2="630" y2="240" stroke="#444" stroke-width="1.4"/>
  <line x1="785" y1="216" x2="785" y2="240" stroke="#444" stroke-width="1.4"/>
  <line x1="475" y1="240" x2="785" y2="240" stroke="#444" stroke-width="1.4"/>
  <path class="ln" d="M630,240 L630,262 L560,262"/>
  <text x="640" y="256" class="s">checked, then full lines copied (O-5/O-6)</text>

  <!-- Wave 2 -->
  <text x="20" y="290" class="w">WAVE 2</text>
  <rect class="exp" x="300" y="266" width="260" height="56" rx="6"/>
  <text x="430" y="288" text-anchor="middle" class="t">Adoption</text>
  <text x="430" y="306" text-anchor="middle" class="s">RECOMMENDATION = PROPOSED ACTION</text>
  <path class="ln" d="M430,322 L430,344"/>
  <text x="440" y="338" class="s">action + DEFER / POSTURE GATE</text>

  <!-- Wave 3 -->
  <text x="20" y="372" class="w">WAVE 3</text>
  <rect class="exp" x="300" y="346" width="260" height="56" rx="6"/>
  <text x="430" y="368" text-anchor="middle" class="t">Organizational Adoption</text>
  <text x="430" y="386" text-anchor="middle" class="s">READINESS VERDICT (stage asked)</text>
  <path class="ln" d="M785,216 L785,374 L562,374"/>
  <text x="792" y="300" class="s">EXECUTION GATES</text>

  <!-- Check -->
  <path class="ln" d="M430,402 L430,428"/>
  <rect class="chk" x="150" y="430" width="560" height="74" rx="6"/>
  <text x="430" y="450" text-anchor="middle" class="t">HARD / SOFT CHECKS (script) — also run at each wave handoff</text>
  <text x="430" y="467" text-anchor="middle" class="s">hard: validator · strict schema · pack discipline per label · recomputed COUNTS</text>
  <text x="430" y="482" text-anchor="middle" class="s">no unverified behind a headline · lane  ‖  soft, warn only: word caps, format</text>
  <text x="430" y="497" text-anchor="middle" class="s">decisive headlines name their supporting passage + source class</text>
  <path class="fb" d="M710,467 L800,467 L800,420"/>
  <text x="806" y="440" class="fbt">hard FAIL → rerun once;</text>
  <text x="806" y="454" class="fbt">2nd → expert FAILED,</text>
  <text x="806" y="468" class="fbt">shown as missing, F-1</text>

  <!-- Conflict table -->
  <path class="ln" d="M430,504 L430,528"/>
  <rect class="chk" x="150" y="530" width="560" height="56" rx="6"/>
  <text x="430" y="551" text-anchor="middle" class="t">BRIEF ASSEMBLY (script)</text>
  <text x="430" y="569" text-anchor="middle" class="s">action→stage readiness (PREPARE ONLY + F-10) · all §4.2 rows · asked_by · flags F-1…F-10</text>

  <!-- Synthesizer -->
  <path class="ln" d="M430,586 L430,610"/>
  <rect class="box" x="150" y="612" width="560" height="74" rx="6"/>
  <text x="430" y="632" text-anchor="middle" class="t">SYNTHESIZER = 1 narrow ChatGPT run (TRADEOFFS + row explanations only)</text>
  <text x="430" y="649" text-anchor="middle" class="s">every sentence carries an exact quoted expert passage</text>
  <text x="430" y="664" text-anchor="middle" class="s">may NOT change the action, average, add evidence, resolve a row, select a vendor</text>
  <text x="430" y="679" text-anchor="middle" class="s">→ SUPPORT CHECK (script): passages verbatim · no new dates/numbers/URLs · rows answered</text>
  <path class="fb" d="M710,664 L800,664 L800,700"/>
  <text x="806" y="690" class="fbt">check fails → script-only</text>
  <text x="806" y="704" class="fbt">brief, F-7</text>

  <!-- Decision diamond -->
  <path class="ln" d="M430,686 L430,712"/>
  <polygon points="430,714 540,764 430,814 320,764" fill="#fff" stroke="#333" stroke-width="1.3"/>
  <text x="430" y="760" text-anchor="middle" class="t">any flag</text>
  <text x="430" y="776" text-anchor="middle" class="t">F-1…F-10?</text>
  <path class="ln" d="M540,764 L690,764"/>
  <text x="590" y="756" class="s">no</text>
  <rect class="box" x="692" y="734" width="258" height="60" rx="6"/>
  <text x="821" y="756" text-anchor="middle" class="t">Brief issued "Accepted by rule"</text>
  <text x="821" y="773" text-anchor="middle" class="s">decision owner notified; may reopen</text>

  <!-- Human -->
  <path class="ln" d="M430,814 L430,840"/>
  <text x="440" y="832" class="s">yes → brief stays Draft</text>
  <rect class="hum" x="150" y="842" width="560" height="84" rx="6"/>
  <text x="430" y="864" text-anchor="middle" class="t">HUMAN DECISION OWNER (role named in intake)</text>
  <text x="430" y="882" text-anchor="middle" class="s">Accept · Modify (any action: Adopt / Bounded experiment / PoC / Monitor / Defer / Reject for now; reason)</text>
  <text x="430" y="898" text-anchor="middle" class="s">Reject (reason) · Request more evidence (→ pack refresh → new run)</text>
  <text x="430" y="914" text-anchor="middle" class="s">Only the human: resolves disagreements · starts despite PREPARE ONLY · changes category · selects vendors</text>

  <!-- Log -->
  <path class="ln" d="M430,926 L430,950"/>
  <path class="ln" d="M821,794 L821,968 L712,968"/>
  <rect class="log" x="150" y="952" width="560" height="62" rx="6"/>
  <text x="430" y="972" text-anchor="middle" class="t">DECISION LOG + RUN RECORD</text>
  <text x="430" y="989" text-anchor="middle" class="s">packets + SHA-256 · chat URLs · raw replies · checks · flags · conflict table</text>
  <text x="430" y="1004" text-anchor="middle" class="s">synthesizer packet/reply · disposition, name, reason, date</text>

  <!-- Legend / fallback -->
  <rect x="20" y="1034" width="940" height="82" rx="6" fill="#fafafa" stroke="#bbb"/>
  <text x="34" y="1054" class="t">Fallback</text>
  <text x="34" y="1072" class="s">Runtime or model/effort label mismatch → no run, logged · Adoption FAILED → "NO PROPOSED ACTION", owner decides · Org Adoption FAILED → "READINESS: not assessed"</text>
  <text x="34" y="1088" class="s">No pack possible → Pack ID NONE, experts retrieve, F-4 (unpinned evidence) · Owner unavailable with open flags → brief stays Draft; nothing proceeds by default</text>
  <text x="34" y="1106" class="s">Blue = ChatGPT expert · amber = deterministic script check · white = template/synthesizer · green = human authority · dashed grey = logs · red dashed = failure path</text>
</svg>
